name: Release Android app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and derive Android version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format (for example, v1.2.3)." >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( major > 2099 || minor > 999 || patch > 999 )); then
            echo "Version components are too large to produce a valid Android versionCode." >&2
            exit 1
          fi

          version_name="${RELEASE_TAG#v}"
          version_code=$((major * 1000000 + minor * 1000 + patch + 1))

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building Athena $version_name (versionCode $version_code)"

  verify:
    name: Test and lint
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATHENA_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      ATHENA_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run unit tests and lint
        run: ./gradlew test lint --stacktrace

  build:
    name: Build signed release APK
    needs:
      - metadata
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATHENA_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      ATHENA_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Restore release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ATHENA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATHENA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATHENA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ATHENA_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ATHENA_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ATHENA_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

          export ATHENA_KEYSTORE_FILE="$RUNNER_TEMP/athena-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ATHENA_KEYSTORE_FILE"
          chmod 600 "$ATHENA_KEYSTORE_FILE"
          echo "ATHENA_KEYSTORE_FILE=$ATHENA_KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ATHENA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ATHENA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ATHENA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify and package APK
        id: package
        shell: bash
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/release/app-release.apk"
          artifact_name="Athena-${ATHENA_VERSION_NAME}.apk"
          artifact_path="$GITHUB_WORKSPACE/dist/$artifact_name"
          checksum_path="$artifact_path.sha256"

          [[ -f "$source_apk" ]] || {
            echo "Expected APK was not produced at $source_apk" >&2
            exit 1
          }

          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          [[ -n "$apksigner" ]] || {
            echo "Unable to find apksigner in the Android SDK." >&2
            exit 1
          }
          "$apksigner" verify --verbose --print-certs "$source_apk"

          mkdir -p "$(dirname "$artifact_path")"
          cp "$source_apk" "$artifact_path"
          (
            cd "$(dirname "$artifact_path")"
            sha256sum "$artifact_name" > "$(basename "$checksum_path")"
          )

          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: athena-release-${{ needs.metadata.outputs.version_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/athena-release.jks"

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ATHENA_VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: athena-release-${{ needs.metadata.outputs.version_name }}
          path: dist/

      - name: Create or update GitHub Release
        shell: bash
        env:
          ARTIFACT_PATH: ${{ github.workspace }}/dist/Athena-${{ needs.metadata.outputs.version_name }}.apk
          CHECKSUM_PATH: ${{ github.workspace }}/dist/Athena-${{ needs.metadata.outputs.version_name }}.apk.sha256
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$ARTIFACT_PATH#Android APK" \
              "$CHECKSUM_PATH#SHA-256 checksum" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" \
              "$ARTIFACT_PATH#Android APK" \
              "$CHECKSUM_PATH#SHA-256 checksum" \
              --verify-tag \
              --generate-notes \
              --title "Athena $ATHENA_VERSION_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
